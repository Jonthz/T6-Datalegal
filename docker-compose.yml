services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: datalegal
      POSTGRES_PASSWORD: datalegal
      POSTGRES_DB: datalegal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datalegal"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://datalegal:datalegal@db:5432/datalegal
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-please}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ENVIRONMENT: development
      SHOW_DOCS: "true"
      SEED_DEV_DATA: "true"
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-admin@datalegal.local}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-Admin123!}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed_dev &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  postgres_data:
  frontend_node_modules:
