[project]
name = "datalegal-backend"
version = "0.1.0"
description = "DataLegal - LOPDP Compliance Platform Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.4.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "pyotp>=2.9.0",
    "python-multipart>=0.0.9",
    "qrcode>=7.4.2",
    "psycopg2-binary>=2.9.9",
    "fpdf2>=2.7.9",
    "openpyxl>=3.1.2",
    "cryptography>=42.0.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "pip-audit>=2.7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "backups*", "alembic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
