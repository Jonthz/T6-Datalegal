services:
  - type: web
    runtime: docker
    name: datalegal-backend
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SHOW_DOCS
        value: "false"
      - key: SEED_DEV_DATA
        value: "false"
      - key: SEED_MOCK_DATA
        value: "false"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: ALGORITHM
        value: HS256
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # US-RF18-1: hourly job that raises internal alerts for critical legal-deadline
  # events (ARCO SLA overdue/approaching, audit plans starting soon). Reuses the
  # same backend image; see backend/scripts/scan_critical_alerts.py.
  - type: cron
    runtime: docker
    name: datalegal-critical-alerts-scan
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: python scripts/scan_critical_alerts.py
    plan: free
    schedule: "0 * * * *"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
